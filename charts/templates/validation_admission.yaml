apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ .Values.ccloud_seeder.domainPrefix }}.seeder.cloud.sap
  labels:
    app: ccloud-seeder
    release: {{ .Release.Name }}
webhooks:
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    url: https://{{ .Values.ccloud_seeder.domainPrefix }}.{{ .Values.global.region }}.cloud.sap/validate_domains/spec.openstack.domains
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: validate-domains.spec.openstack.domains.{{ .Values.ccloud_seeder.domainPrefix }}.seeder.cloud.sap
  namespaceSelector: {}
  objectSelector: {}
  rules:
  - apiGroups:
    - seeder.cloud.sap
    apiVersions:
    - v1
    operations:
    - '*'
    resources:
    - ccloudseeds
    scope: '*'
  sideEffects: None
  timeoutSeconds: 30
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    url: https://{{ .Values.ccloud_seeder.domainPrefix }}.{{ .Values.global.region }}.cloud.sap/validate_networks/spec.openstack.networks
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: validate-networks.spec.openstack.networks.{{ .Values.ccloud_seeder.domainPrefix }}.seeder.cloud.sap
  namespaceSelector: {}
  objectSelector: {}
  rules:
  - apiGroups:
    - seeder.cloud.sap
    apiVersions:
    - v1
    operations:
    - '*'
    resources:
    - ccloudseeds
    scope: '*'
  sideEffects: None
  timeoutSeconds: 30
- admissionReviewVersions:
  - v1
  - v1beta1
  clientConfig:
    url: https://{{ .Values.ccloud_seeder.domainPrefix }}.{{ .Values.global.region }}.cloud.sap/validate_networks/spec.openstack.address_scopes
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: validate-address-scopes.spec.openstack.address-scopes.{{ .Values.ccloud_seeder.domainPrefix }}.seeder.cloud.sap
  namespaceSelector: {}
  objectSelector: {}
  rules:
  - apiGroups:
    - seeder.cloud.sap
    apiVersions:
    - v1
    operations:
    - '*'
    resources:
    - ccloudseeds
    scope: '*'
  sideEffects: None
  timeoutSeconds: 30
