apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/tls-acme: "true"
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
    {{- include "utils.linkerd.ingress_annotation" . | indent 4 }}
    disco: "true"
  labels:
    app: ccloud-seeder
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
  name: ccloud-seeder-webhook
  namespace: {{ .Release.Namespace }}
spec:
  rules:
  - host: {{ .Release.Name }}.{{ .Values.global.region }}.cloud.sap
    http:
      paths:
        - path: /
          pathType: ImplementationSpecific
          backend:
            service:
              name: ccloud-seeder
              port:
                number: 80
  tls:
  - hosts:
    - {{ .Release.Name }}.{{ .Values.global.region }}.cloud.sap
    secretName: tls-{{ .Release.Name }}-{{ .Values.global.region }}-cloud-sap
